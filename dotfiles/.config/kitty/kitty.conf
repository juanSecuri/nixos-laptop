# ML4W kitty — vidrio + Nerd Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12

remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        12
hide_window_decorations     yes
confirm_os_window_close     0
cursor_trail                1

# Vidrio (como demo ML4W)
background_opacity          0.72
dynamic_background_opacity  yes
background_blur             25

# Tema oscuro limpio
foreground            #e8eef8
background            #12141a
cursor                #33ccff
cursor_text_color       #12141a
selection_foreground    #12141a
selection_background    #33ccff

color0  #3b4252
color1  #ff6b6b
color2  #50fa7b
color3  #f1fa8c
color4  #33ccff
color5  #bd93f9
color6  #8be9fd
color7  #e8eef8
color8  #6c7a89
color9  #ff8787
color10 #69ff94
color11 #ffffa5
color12 #5cd6ff
color13 #d6acff
color14 #a4ffff
color15 #ffffff

# Arrancar en zsh si existe
shell zsh
