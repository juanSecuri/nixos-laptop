# Ventanas flotantes
windowrule = float on, center on, match:class ^(pavucontrol)$
windowrule = float on, center on, match:class ^(nm-connection-editor)$

# Opacidad vidrio — terminal, archivos, web, dev
windowrule = opacity 0.82 override 0.76 override, match:class ^(kitty)$
windowrule = opacity 0.90 override 0.85 override, match:class ^(Thunar)$
windowrule = opacity 0.93 override 0.88 override, match:class ^(firefox)$
windowrule = opacity 0.93 override 0.88 override, match:class ^(Firefox)$
windowrule = opacity 0.94 override 0.90 override, match:class ^(code)$
windowrule = opacity 0.94 override 0.90 override, match:class ^(Code)$
windowrule = opacity 0.94 override 0.90 override, match:class ^(cursor)$
windowrule = opacity 0.94 override 0.90 override, match:class ^(Cursor)$
