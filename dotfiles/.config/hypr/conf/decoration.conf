# ML4W pro — vidrio, blur, opacidad
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 10
        passes = 3
    }

    shadow {
        enabled = true
        range = 14
        render_power = 4
        color = rgba(1a1a1a99)
    }
}
