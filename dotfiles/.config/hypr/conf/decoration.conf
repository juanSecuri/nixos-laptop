# ML4W — decoración con más blur (efecto vidrio)
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1a88)
    }
}
