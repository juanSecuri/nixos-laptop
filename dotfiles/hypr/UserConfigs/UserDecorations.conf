# Decoraciones — look profesional dev (sobrio)
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(585b70aa)
    resize_on_border = true
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000066)
    }
}
